[pytest]
# Pytest configuration for OSAM Visualizer

# Custom markers
markers =
    integration: marks tests as integration tests (slow, multi-module)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short --strict-markers

# Minimum Python version
minversion = 3.13
